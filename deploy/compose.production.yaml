name: framekeep-production

services:
  framekeep:
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: "512mb"
    environment:
      FRAMEKEEP_HOST: "0.0.0.0"
      FRAMEKEEP_PORT: "4173"
      FRAMEKEEP_DATA_DIR: /var/lib/framekeep
      # Private mode validates this in both validate-production.py and the server entry point.
      FRAMEKEEP_ADMIN_TOKEN: "${FRAMEKEEP_ADMIN_TOKEN:-}"
      FRAMEKEEP_ALLOWED_HOSTS: "${FRAMEKEEP_DOMAIN:?Set the public hostname without scheme or path},localhost,127.0.0.1,[::1]"
      # Trust only our reverse proxy, never all clients or the entire Docker subnet.
      FORWARDED_ALLOW_IPS: "${FRAMEKEEP_PROXY_IP:-172.30.246.2}"
      FRAMEKEEP_MAX_DOWNLOAD_BYTES: "${FRAMEKEEP_MAX_DOWNLOAD_BYTES:-2147483648}"
      FRAMEKEEP_MIN_FREE_BYTES: "${FRAMEKEEP_MIN_FREE_BYTES:-536870912}"
      FRAMEKEEP_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      FRAMEKEEP_TRUST_FAKE_DNS: "0"
    volumes:
      - framekeep_data:/var/lib/framekeep
    networks:
      app:
        ipv4_address: "${FRAMEKEEP_BACKEND_IP:-172.30.246.3}"
    # Deliberately no ports: only Caddy can provide the public entry point.
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import base64,json,os,urllib.request;
          token=base64.b64encode(('admin:'+os.environ['FRAMEKEEP_ADMIN_TOKEN']).encode()).decode();
          request=urllib.request.Request('http://127.0.0.1:4173/api/ready',headers={'Authorization':'Basic '+token});
          result=json.load(urllib.request.urlopen(request,timeout=5));
          assert result.get('ready') is True
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  caddy:
    image: "${FRAMEKEEP_CADDY_IMAGE:-caddy:2.11.9-alpine}"
    restart: unless-stopped
    depends_on:
      framekeep:
        condition: service_healthy
    environment:
      FRAMEKEEP_DOMAIN: "${FRAMEKEEP_DOMAIN:?Set the public hostname without scheme or path}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      app:
        ipv4_address: "${FRAMEKEEP_PROXY_IP:-172.30.246.2}"
    security_opt:
      - no-new-privileges:true

networks:
  app:
    driver: bridge
    ipam:
      config:
        - subnet: "${FRAMEKEEP_NETWORK_SUBNET:-172.30.246.0/24}"

volumes:
  framekeep_data:
  caddy_data:
  caddy_config:
